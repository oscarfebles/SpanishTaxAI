<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat — SpanishTax AI</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF8F4; --bg-alt: #F4F0E8; --bg-sidebar: #F0EDE6;
      --surface: #FFFFFF; --surface2: #F7F4EE;
      --ink: #0F2547; --ink-soft: #1E3358; --muted: #6B6B6B;
      --accent: #C8553D; --accent-soft: #FBF1F0;
      --line: #E8E4DC; --line-soft: #EEE9E0;
      --user-bubble: #0F2547; --user-text: #FFFFFF;
      --bot-bubble: #FFFFFF; --bot-text: #1E3358;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --radius: 12px;
      --sidebar-w: 260px;
    }
    [data-theme="dark"] {
      --bg: #111318; --bg-alt: #1A1D24; --bg-sidebar: #161920;
      --surface: #1E2128; --surface2: #252830;
      --ink: #F0EDE6; --ink-soft: #D4D0C8; --muted: #8A8A8A;
      --accent: #E06A52; --accent-soft: #2A1F1C;
      --line: #2E3038; --line-soft: #252830;
      --user-bubble: #C8553D; --user-text: #FFFFFF;
      --bot-bubble: #1E2128; --bot-text: #D4D0C8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: var(--sans); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
    #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app { display: none; height: 100vh; flex-direction: row; }
    .sidebar { width: var(--sidebar-w); background: var(--bg-sidebar); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; overflow: hidden; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .brand { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
    .brand-dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; }
    .btn-new { background: var(--accent); color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--sans); }
    .btn-new:hover { background: #A8412F; }
    .sidebar-conversations { flex: 1; overflow-y: auto; padding: 8px; }
    .conv-group-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 8px 4px; }
    .conv-item { padding: 9px 10px; border-radius: 8px; cursor: pointer; transition: background 150ms; display: flex; align-items: center; gap: 8px; position: relative; }
    .conv-item:hover { background: var(--line-soft); }
    .conv-item.active { background: var(--surface); }
    .conv-item-title { font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .conv-item-del { display: none; background: none; border: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 14px; }
    .conv-item:hover .conv-item-del { display: block; }
    .conv-item-del:hover { color: var(--accent); }
    .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .theme-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .theme-btn { background: none; border: 1px solid var(--line); color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    .theme-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .sidebar-user { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sidebar-user-email { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-signout { font-size: 11px; color: var(--muted); background: none; border: 1px solid var(--line); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .btn-signout:hover { color: var(--accent); border-color: var(--accent); }
    .chat-main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg); }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; background: var(--surface); flex-shrink: 0; }
    .chat-title { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--ink); }
    .chat-header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-icon { background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; text-decoration: none; }
    .btn-icon:hover { color: var(--ink); border-color: var(--ink-soft); }
    .messages { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
    .message { display: flex; gap: 12px; max-width: 820px; margin: 0 auto; width: 100%; }
    .message.user { flex-direction: row-reverse; }
    .avatar { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .avatar-bot { background: var(--accent-soft); color: var(--accent); font-family: var(--serif); }
    .avatar-user { background: var(--user-bubble); color: var(--user-text); }
    .bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; max-width: 75%; }
    .bubble-bot { background: var(--bot-bubble); color: var(--bot-text); border: 1px solid var(--line); border-radius: 4px var(--radius) var(--radius) var(--radius); box-shadow: 0 2px 8px rgba(15,37,71,0.07); }
    .bubble-user { background: var(--user-bubble); color: var(--user-text); border-radius: var(--radius) 4px var(--radius) var(--radius); }
    .typing { display: flex; gap: 4px; align-items: center; padding: 14px 16px; }
    .typing span { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
    .empty-logo { font-family: var(--serif); font-size: 32px; color: var(--ink); font-weight: 600; margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; max-width: 400px; line-height: 1.6; }
    .starters { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 600px; width: 100%; }
    .starter { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-align: left; cursor: pointer; font-size: 13px; color: var(--ink-soft); }
    .starter:hover { border-color: var(--accent); color: var(--ink); }
    .starter-icon { font-size: 16px; margin-bottom: 6px; display: block; }
    .input-area { padding: 12px 20px 16px; background: var(--surface); border-top: 1px solid var(--line); flex-shrink: 0; }
    .attached-files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .attached-chip { display: flex; align-items: center; gap: 6px; background: var(--bg-alt); border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px 4px 8px; font-size: 12px; }
    .chip-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
    .chip-remove:hover { color: var(--accent); }
    .input-row { display: flex; align-items: flex-end; gap: 8px; background: var(--bg-alt); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; }
    .input-row:focus-within { border-color: var(--accent); }
    .btn-attach { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 6px; }
    .btn-attach:hover { color: var(--accent); }
    #message-input { flex: 1; background: none; border: none; outline: none; font-family: var(--sans); font-size: 14px; color: var(--ink); resize: none; min-height: 24px; max-height: 160px; line-height: 1.5; }
    .btn-send { background: var(--accent); color: white; border: none; width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
    .btn-send:hover { background: #A8412F; }
    .btn-send:disabled { background: var(--line); cursor: not-allowed; }
    .input-footer { font-size: 11px; color: var(--muted); text-align: center; margin-top: 8px; }
    #file-input { display: none; }
    .paywall-msg { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 10px; padding: 16px 20px; text-align: center; font-size: 14px; }
    .paywall-msg a { color: var(--accent); font-weight: 500; }
    .btn-sidebar-toggle { display: none; background: none; border: none; color: var(--ink); font-size: 20px; cursor: pointer; padding: 4px; }
    @media (max-width: 700px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); transition: transform 250ms; }
      .sidebar.open { transform: translateX(0); }
      .btn-sidebar-toggle { display: block; }
      .starters { grid-template-columns: 1fr; }
      .bubble { max-width: 90%; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>
<div id="app" style="display:none; flex-direction:row; height:100vh;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/app.html" class="brand"><span class="brand-dot"></span>SpanishTax AI</a>
      <button class="btn-new" onclick="newConversation()">+ New</button>
    </div>
    <div class="sidebar-conversations" id="conv-list"></div>
    <div class="sidebar-footer">
      <div class="theme-toggle">
        <span>Theme:</span>
        <button class="theme-btn" onclick="setTheme('light')" data-t="light">Light</button>
        <button class="theme-btn" onclick="setTheme('dark')" data-t="dark">Dark</button>
        <button class="theme-btn active" onclick="setTheme('auto')" data-t="auto">Auto</button>
      </div>
      <div class="sidebar-user">
        <span class="sidebar-user-email" id="sidebar-email"></span>
        <button class="btn-signout" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </aside>
  <div class="chat-main">
    <div class="chat-header">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn-sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="chat-title" id="chat-title">New conversation</span>
      </div>
      <div class="chat-header-actions"><a href="/app.html" class="btn-icon">← Dashboard</a></div>
    </div>
    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-logo">SpanishTax AI</div>
        <p class="empty-sub">Your DNV and autónomo questions answered — with knowledge of Spanish tax law, not generic AI guesses.</p>
        <div class="starters" id="starters">
          <button class="starter" onclick="useStarter(this)"><span class="starter-icon">📋</span>What documents do I need for the DNV application?</button>
          <button class="starter" onclick="useStarter(this)"><span class="starter-icon">💰</span>Does Beckham Law make sense for my income level?</button>
          <button class="starter" onclick="useStarter(this)"><span class="starter-icon">🏢</span>How does my US LLC affect my Spanish tax situation?</button>
          <button class="starter" onclick="useStarter(this)"><span class="starter-icon">📅</span>What are the key deadlines after arriving in Spain?</button>
        </div>
      </div>
    </div>
    <div class="input-area">
      <div class="attached-files" id="attached-files"></div>
      <div class="input-row">
        <button class="btn-attach" onclick="document.getElementById('file-input').click()">📎</button>
        <input type="file" id="file-input" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" multiple onchange="handleFileAttach(this)">
        <textarea id="message-input" placeholder="Ask anything about Spain DNV, taxes, autónomo..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">↑</button>
      </div>
      <div class="input-footer">SpanishTax AI can make mistakes. For binding advice, use the expert review option.</div>
    </div>
  </div>
</div>
<script>
if (typeof window.supabase === 'undefined') { window.location.href = '/login.html'; }
var WORKER_URL = 'https://spanishtax-chatbot.oscargonzalezfebles.workers.dev/chat';
var sb = window.supabase.createClient('https://jxoepqwbalhdwwbycksa.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4b2VwcXdiYWxoZHd3Ynlja3NhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjQ1NDAsImV4cCI6MjA5NjQ0MDU0MH0.MRO1t5kZIfIw8HORTjEYvU_TUeri7ovXKSHKHRxnJJQ');
let currentUser = null, currentConvId = null, conversations = [], history = [], pendingFiles = [], isStreaming = false;
function setTheme(t) { localStorage.setItem('stx_theme', t); applyTheme(t); document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t)); }
function applyTheme(t) { if (t === 'auto') { document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } else { document.documentElement.dataset.theme = t; } }
function loadConversations() { try { conversations = JSON.parse(localStorage.getItem('stx_conversations_' + currentUser.id) || '[]'); } catch { conversations = []; } }
function saveConversations() { localStorage.setItem('stx_conversations_' + currentUser.id, JSON.stringify(conversations)); }
function renderConversationList() { const el = document.getElementById('conv-list'); if (!conversations.length) { el.innerHTML = '<div style="padding:16px 8px;font-size:13px;color:var(--muted);">No conversations yet.</div>'; return; } const today = new Date().toDateString(); const yesterday = new Date(Date.now() - 86400000).toDateString(); const groups = { Today: [], Yesterday: [], Older: [] }; for (const c of conversations) { const d = new Date(c.updatedAt).toDateString(); if (d === today) groups.Today.push(c); else if (d === yesterday) groups.Yesterday.push(c); else groups.Older.push(c); } let html = ''; for (const [label, items] of Object.entries(groups)) { if (!items.length) continue; html += `<div class="conv-group-label">${label}</div>`; for (const c of items) { html += `<div class="conv-item ${c.id === currentConvId ? 'active' : ''}" onclick="loadConversation('${c.id}')"><span class="conv-item-title">${escapeHtml(c.title || 'Untitled')}</span><button class="conv-item-del" onclick="event.stopPropagation();deleteConversation('${c.id}')">×</button></div>`; } } el.innerHTML = html; }
function newConversation() { currentConvId = null; history = []; document.getElementById('chat-title').textContent = 'New conversation'; document.getElementById('messages').innerHTML = ''; renderEmptyState(); renderConversationList(); }
function loadConversation(id) { const conv = conversations.find(c => c.id === id); if (!conv) return; currentConvId = id; history = conv.messages || []; document.getElementById('chat-title').textContent = conv.title || 'Untitled'; const msgsEl = document.getElementById('messages'); msgsEl.innerHTML = ''; for (const msg of history) { appendMessage(msg.role, msg.content, msg.files, false); } renderConversationList(); msgsEl.scrollTop = msgsEl.scrollHeight; }
function deleteConversation(id) { conversations = conversations.filter(c => c.id !== id); saveConversations(); if (currentConvId === id) newConversation(); else renderConversationList(); }
function saveCurrentConversation(userMsg) { if (!currentConvId) { currentConvId = 'conv_' + Date.now(); const title = userMsg.slice(0, 50) + (userMsg.length > 50 ? '...' : ''); conversations.unshift({ id: currentConvId, title, messages: history, updatedAt: new Date().toISOString() }); document.getElementById('chat-title').textContent = title; } else { const conv = conversations.find(c => c.id === currentConvId); if (conv) { conv.messages = history; conv.updatedAt = new Date().toISOString(); } } saveConversations(); renderConversationList(); }
function appendMessage(role, content, files, scroll = true) { const msgsEl = document.getElementById('messages'); const emptyEl = document.getElementById('empty-state'); if (emptyEl) emptyEl.remove(); const msg = document.createElement('div'); msg.className = `message ${role}`; const avatar = document.createElement('div'); avatar.className = `avatar avatar-${role === 'user' ? 'user' : 'bot'}`; avatar.textContent = role === 'user' ? 'U' : 'ST'; const bubble = document.createElement('div'); bubble.className = `bubble bubble-${role === 'user' ? 'user' : 'bot'}`; if (files && files.length) { for (const f of files) { const chip = document.createElement('div'); chip.className = 'file-attachment'; chip.innerHTML = `<span>📄</span><span>${escapeHtml(f.name)}</span><span>${formatBytes(f.size || 0)}</span>`; bubble.appendChild(chip); } } const contentEl = document.createElement('div'); contentEl.className = 'message-content'; contentEl.innerHTML = formatMarkdown(content || ''); bubble.appendChild(contentEl); msg.appendChild(avatar); msg.appendChild(bubble); msgsEl.appendChild(msg); if (scroll) msgsEl.scrollTop = msgsEl.scrollHeight; return { bubble, contentEl }; }
function appendTyping() { const msgsEl = document.getElementById('messages'); const msg = document.createElement('div'); msg.className = 'message assistant'; msg.id = 'typing-msg'; const avatar = document.createElement('div'); avatar.className = 'avatar avatar-bot'; avatar.textContent = 'ST'; const bubble = document.createElement('div'); bubble.className = 'bubble bubble-bot'; bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>'; msg.appendChild(avatar); msg.appendChild(bubble); msgsEl.appendChild(msg); msgsEl.scrollTop = msgsEl.scrollHeight; return msg; }
function renderEmptyState() { const msgsEl = document.getElementById('messages'); msgsEl.innerHTML = ''; const es = document.createElement('div'); es.id = 'empty-state'; es.className = 'empty-state'; es.innerHTML = `<div class="empty-logo">SpanishTax AI</div><p class="empty-sub">Your DNV and autónomo questions answered — with knowledge of Spanish tax law, not generic AI guesses.</p><div class="starters"><button class="starter" onclick="useStarter(this)"><span class="starter-icon">📋</span>What documents do I need for the DNV application?</button><button class="starter" onclick="useStarter(this)"><span class="starter-icon">💰</span>Does Beckham Law make sense for my income level?</button><button class="starter" onclick="useStarter(this)"><span class="starter-icon">🏢</span>How does my US LLC affect my Spanish tax situation?</button><button class="starter" onclick="useStarter(this)"><span class="starter-icon">📅</span>What are the key deadlines after arriving in Spain?</button></div>`; msgsEl.appendChild(es); }
async function sendMessage() { if (isStreaming) return; const input = document.getElementById('message-input'); const text = input.value.trim(); if (!text && !pendingFiles.length) return; const filesToSend = [...pendingFiles]; pendingFiles = []; document.getElementById('attached-files').innerHTML = ''; input.value = ''; autoResize(input); document.getElementById('send-btn').disabled = true; isStreaming = true; appendMessage('user', text, filesToSend); history.push({ role: 'user', content: text, files: filesToSend }); saveCurrentConversation(text); const typingEl = appendTyping(); try { let body, headers = {}; const { data: { session } } = await sb.auth.getSession(); if (session?.access_token) headers['Authorization'] = `Bearer ${session.access_token}`; if (filesToSend.length) { const fd = new FormData(); fd.append('message', text); fd.append('session_id', getSessionId()); fd.append('history', JSON.stringify(history.slice(-10).map(m => ({ role: m.role, content: m.content })))); for (const f of filesToSend) if (f.blob) fd.append('files', f.blob, f.name); body = fd; } else { headers['Content-Type'] = 'application/json'; body = JSON.stringify({ message: text, session_id: getSessionId(), history: history.slice(-10).map(m => ({ role: m.role, content: m.content })), authenticated: true }); } const res = await fetch(WORKER_URL, { method: 'POST', headers, body }); typingEl.remove(); if (res.status === 402) { appendPaywallMessage(); return; } if (!res.ok) { appendMessage('assistant', 'Something went wrong. Please try again.'); return; } const { bubble, contentEl } = appendMessage('assistant', '', null); let fullText = ''; const reader = res.body.getReader(); const decoder = new TextDecoder(); while (true) { const { done, value } = await reader.read(); if (done) break; const chunk = decoder.decode(value, { stream: true }); const lines = chunk.split('\n'); for (const line of lines) { if (line.startsWith('data: ')) { const data = line.slice(6); if (data === '[DONE]') break; try { const parsed = JSON.parse(data); if (parsed.type === 'content_block_delta' && parsed.delta?.text) { fullText += parsed.delta.text; contentEl.innerHTML = formatMarkdown(fullText); bubble.closest('.messages')?.scrollTo(0, bubble.closest('.messages').scrollHeight); } } catch {} } } } history.push({ role: 'assistant', content: fullText }); saveCurrentConversation(text); } catch (err) { typingEl.remove(); appendMessage('assistant', 'Connection error. Please try again.'); console.error(err); } finally { isStreaming = false; document.getElementById('send-btn').disabled = false; } }
function appendPaywallMessage() { const msgsEl = document.getElementById('messages'); const el = document.createElement('div'); el.className = 'message assistant'; el.innerHTML = `<div class="avatar avatar-bot">ST</div><div class="bubble bubble-bot"><div class="paywall-msg">You've reached your message limit. <a href="/app.html#pricing">Upgrade your plan</a> to continue.</div></div>`; msgsEl.appendChild(el); msgsEl.scrollTop = msgsEl.scrollHeight; }
function handleFileAttach(input) { for (const file of Array.from(input.files)) { if (file.size > 10 * 1024 * 1024) { alert(`${file.name} is too large. Max 10MB.`); continue; } pendingFiles.push({ name: file.name, size: file.size, blob: file }); } renderAttachedFiles(); input.value = ''; }
function renderAttachedFiles() { document.getElementById('attached-files').innerHTML = pendingFiles.map((f, i) => `<div class="attached-chip">📄 <span>${escapeHtml(f.name)}</span><button class="chip-remove" onclick="removeFile(${i})">×</button></div>`).join(''); }
function removeFile(i) { pendingFiles.splice(i, 1); renderAttachedFiles(); }
function getSessionId() { let id = localStorage.getItem('stx_session_id'); if (!id) { id = 'pro_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('stx_session_id', id); } return id; }
function useStarter(btn) { document.getElementById('message-input').value = btn.textContent.replace(/^[^\w]+/, '').trim(); sendMessage(); }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
async function signOut() { await sb.auth.signOut(); window.location.href = '/login.html'; }
function escapeHtml(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatBytes(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(0) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
function formatMarkdown(t) { if (!t) return ''; return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^---$/gm,'<hr>').replace(/^\* (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>').replace(/\n/g,'<br>'); }
async function init() { const { data: { session } } = await sb.auth.getSession(); if (!session) { window.location.href = '/login.html'; return; } currentUser = session.user; document.getElementById('sidebar-email').textContent = session.user.email; document.getElementById('loading').style.display = 'none'; document.getElementById('app').style.display = 'flex'; loadConversations(); renderConversationList(); const savedTheme = localStorage.getItem('stx_theme') || 'auto'; applyTheme(savedTheme); document.querySelectorAll('.theme-btn').forEach(b => b.classList.toggle('active', b.dataset.t === savedTheme)); sb.auth.onAuthStateChange(e => { if (e === 'SIGNED_OUT') window.location.href = '/login.html'; }); }
init();
</script>
